<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvas POC-04 Chrome IME validation</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 24px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 140px; font-size: 24px; padding: 16px; }
      #status { padding: 12px; background: #fff4cc; border-radius: 8px; }
      #status[data-passed="true"] { background: #d8f7df; }
      pre { overflow: auto; max-height: 340px; padding: 16px; background: #f5f5f5; }
      button { font-size: 16px; padding: 10px 16px; }
    </style>
  </head>
  <body>
    <h1>Canvas POC-04 Chrome Stable IME validation</h1>
    <ol>
      <li>Confirm this page is open in Chrome Stable on the physical Windows machine.</li>
      <li>Select Microsoft Pinyin, focus the box, type <code>ni hao</code>, and choose <code>你好</code>.</li>
      <li>Confirm the status turns green, then download the JSON report.</li>
    </ol>
    <p id="status">Loading the C++20 WASM Runtime…</p>
    <textarea id="ime" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <p><button id="download" type="button">Download evidence JSON</button></p>
    <pre id="output"></pre>
    <script type="module" src="./physical_recorder.js"></script>
  </body>
</html>
