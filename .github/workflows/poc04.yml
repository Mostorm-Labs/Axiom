name: POC-04 RichText and IME

on:
  pull_request:
    paths:
      - "deps.lock.json"
      - "pocs/rich_text/**"
      - ".github/workflows/poc04.yml"
  push:
    branches: [main]
    paths:
      - "deps.lock.json"
      - "pocs/rich_text/**"
      - ".github/workflows/poc04.yml"
  workflow_dispatch:

concurrency:
  group: poc04-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE: tools/skia/profiles/poc04-richtext-v2.json
  LOCK: pocs/rich_text/skia-sdk.lock.json
  INSTALL: .deps/skia-sdk-poc04

jobs:
  sdk-lock:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.lock.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: lock
        shell: bash
        run: |
          if [[ -f "$LOCK" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RichText SDK lock is not published yet; platform consumers remain pending." >> "$GITHUB_STEP_SUMMARY"
          fi

  host-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap isolated core dependencies
        run: python3 tools/bootstrap_deps.py --core --font-only
      - name: Validate source-free consumer and SDK schemas
        run: |
          python3 pocs/rich_text/tools/check_consumer_ci.py
          python3 pocs/rich_text/tools/test_behavior_conformance.py -v
          python3 tools/poc04/validate_physical_ime.py docs/quality/evidence/poc04/windows-ime-20260820-r2.json docs/quality/evidence/poc04/chrome-ime-20260820-r2.json
          python3 tools/poc04/validate_apple_ime.py docs/quality/evidence/poc04/apple-iphone15pro-ime-20260820.json docs/quality/evidence/poc04/apple-ipad-air4-ime-20260820.json
          python3 tools/poc04/validate_android_ime.py docs/quality/evidence/poc04/android-ime-20260820.json
          python3 tools/poc04/validate_macos_ime.py docs/quality/evidence/poc04/macos-ime-20260820.json
          python3 -m unittest discover -s tools/skia/tests -v
          git diff --check
      - name: Build and test core
        run: |
          cmake -S pocs/rich_text -B out/poc04-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/poc04-host --parallel
          ctest --test-dir out/poc04-host --output-on-failure
          out/poc04-host/canvas_poc04_cli --lifecycle=100
          out/poc04-host/canvas_poc04_behavior_report --platform=host --output=out/poc04-host/host-behavior.json
      - uses: actions/upload-artifact@v4
        with:
          name: poc04-host
          path: out/poc04-host/host-behavior.json

  web:
    needs: sdk-lock
    if: needs.sdk-lock.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: pocs/rich_text/platform/web/package-lock.json
      - name: Bootstrap compiler and core dependencies
        run: python3 tools/bootstrap_deps.py --core --web
      - name: Fetch verified RichText Web SDK
        run: python3 tools/skia/fetch.py --profile "$PROFILE" --lock "$LOCK" --install-root "$INSTALL" --target web-wasm-webgl2 --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build source-free Web adapter and SkParagraph
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          cmake -S pocs/rich_text -B out/poc04-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.deps/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" -DCANVAS_POC04_BUILD_TESTS=OFF -DCANVAS_POC04_ENABLE_SKPARAGRAPH=ON -DCANVAS_POC04_BUILD_WEB=ON
          cmake --build out/poc04-web --parallel
          test -s out/poc04-web/platform/web/canvas_poc04_web.data
          test -s out/poc04-web/platform/web/canvas_poc04_web.js
          test -s out/poc04-web/platform/web/canvas_poc04_web.wasm
          ! grep -E -l "pthread|SharedArrayBuffer" out/poc04-web/platform/web/canvas_poc04_web.js
      - name: Install Web test dependencies
        timeout-minutes: 5
        working-directory: pocs/rich_text/platform/web
        run: |
          npm ci
      - name: Validate browser IME event adapter
        timeout-minutes: 5
        working-directory: pocs/rich_text/platform/web
        run: |
          npm run build
          npm test
      - name: Record canonical Web Runtime behavior in Chromium
        timeout-minutes: 5
        working-directory: pocs/rich_text/platform/web
        run: |
          POC04_WASM_DIR="$GITHUB_WORKSPACE/out/poc04-web/platform/web" POC04_BEHAVIOR_OUTPUT="$GITHUB_WORKSPACE/out/poc04-web/web-behavior.json" npm run record:wasm
      - name: Validate canonical Web behavior artifact
        run: |
          test -s "$GITHUB_WORKSPACE/out/poc04-web/web-behavior.json"
      - uses: actions/upload-artifact@v4
        with:
          name: poc04-web
          path: out/poc04-web/web-behavior.json

  windows:
    needs: sdk-lock
    if: needs.sdk-lock.outputs.available == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Bootstrap core and pinned Windows LLVM
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --core --windows-llvm
          $installer = Resolve-Path .deps/downloads/LLVM-22.1.8-win64.exe
          $installDir = Join-Path $PWD ".deps/llvm"
          Start-Process $installer -ArgumentList "/S", "/D=$installDir" -Wait
      - name: Fetch verified RichText Windows SDK
        shell: pwsh
        run: python tools/skia/fetch.py --profile "$env:PROFILE" --lock "$env:LOCK" --install-root "$env:INSTALL" --target windows-x64-d3d12 --summary-file "$env:GITHUB_STEP_SUMMARY"
      - name: Build and test Win32 IME adapter
        shell: pwsh
        run: |
          cmake -S pocs/rich_text -B out/poc04-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe" -DCANVAS_POC04_ENABLE_SKPARAGRAPH=ON -DCANVAS_POC04_BUILD_WINDOWS=ON
          cmake --build out/poc04-windows --parallel
          ctest --test-dir out/poc04-windows --output-on-failure
          out/poc04-windows/canvas_poc04_canonical_behavior_report.exe --platform=windows --output=out/poc04-windows/windows-behavior.json
          if (-not (Test-Path out/poc04-windows/platform/windows/canvas_poc04_windows_demo.exe)) {
            throw "Windows physical IME recorder was not built"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: poc04-windows
          path: |
            out/poc04-windows/windows-behavior.json
            out/poc04-windows/platform/windows/canvas_poc04_windows_demo.exe

  android:
    needs: sdk-lock
    if: needs.sdk-lock.outputs.available == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { abi: arm64-v8a, target: android-arm64-v8a-gles3 }
          - { abi: x86_64, target: android-x86_64-gles3, emulator: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Install pinned Android NDK and core dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.5" "ndk;27.2.12479018"
          python3 tools/bootstrap_deps.py --core --font-only
      - name: Install Android emulator image
        if: matrix.emulator == true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "emulator" "platform-tools" "system-images;android-35;default;x86_64"
      - name: Fetch verified RichText Android SDK
        run: python3 tools/skia/fetch.py --profile "$PROFILE" --lock "$LOCK" --install-root "$INSTALL" --target "${{ matrix.target }}" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build Native CanvasView JNI data plane
        run: |
          performance_gate=true
          if [[ "${{ matrix.emulator }}" == "true" ]]; then
            performance_gate=false
          fi
          gradle -p pocs/rich_text/platform/android :app:assembleRelease -PcanvasPoc04Abi="${{ matrix.abi }}" -PcanvasPoc04CanonicalBehavior=true -PcanvasPoc04EnforcePerformanceGate="$performance_gate" --no-daemon
          mkdir -p out/poc04-android
          unzip -Z1 pocs/rich_text/platform/android/app/build/outputs/apk/release/app-release.apk > out/poc04-android/apk-files.txt
          grep -Fx 'assets/fonts/Roboto-Regular.ttf' out/poc04-android/apk-files.txt
          grep -Fx 'assets/fonts/NotoSansCJK-VF-subset.otf.ttc' out/poc04-android/apk-files.txt
      - name: Enable Android emulator hardware acceleration
        if: matrix.emulator == true
        run: sudo chmod 0666 /dev/kvm
      - name: Record canonical Android Runtime behavior
        if: matrix.emulator == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash pocs/rich_text/platform/android/record_canonical_behavior.sh
      - name: Summarize non-representative emulator timing
        if: matrix.emulator == true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("out/poc04-android/android-behavior.json").read_text())
          performance = report["performance"]
          print("### Android x86_64 emulator timing (observational)\n")
          print("GitHub's shared x86_64 emulator is a correctness recorder, not the representative-device performance gate.")
          print(f"- Input/caret p95: `{performance['input_caret_p95_ms']} ms`")
          print(f"- Full layout p95: `{performance['full_layout_p95_ms']} ms`")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.emulator == true }}
        with:
          name: poc04-android
          path: out/poc04-android/

  apple:
    needs: sdk-lock
    if: needs.sdk-lock.outputs.available == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: macosx, target: macos-arm64-metal, platform: macos, deployment: "15.0" }
          - { sdk: iphonesimulator, target: ios-simulator-arm64-metal, platform: ios, deployment: "17.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap core dependencies and fetch verified Apple SDK
        run: |
          python3 tools/bootstrap_deps.py --core --font-only
          python3 tools/skia/fetch.py --profile "$PROFILE" --lock "$LOCK" --install-root "$INSTALL" --target "${{ matrix.target }}" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build real Apple IME adapter and recorder
        run: |
          extra=()
          if [[ "${{ matrix.platform }}" == "ios" ]]; then
            extra+=("-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/ios-simulator.toolchain.cmake")
          fi
          cmake -S pocs/rich_text -B "out/poc04-${{ matrix.platform }}" -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sdk }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment }}" \
            -DCANVAS_POC04_BUILD_TESTS=OFF \
            -DCANVAS_POC04_ENABLE_SKPARAGRAPH=ON \
            -DCANVAS_POC04_BUILD_APPLE=ON \
            "${extra[@]}"
          cmake --build "out/poc04-${{ matrix.platform }}" --config Release --parallel
      - name: Run AppKit recorder
        if: matrix.platform == 'macos'
        run: |
          app=$(find out/poc04-macos -name canvas_poc04_macos_ime_recorder.app -type d | head -1)
          "$app/Contents/MacOS/canvas_poc04_macos_ime_recorder" | tee out/poc04-macos/macos-ime-behavior.json
          test -s out/poc04-macos/macos-ime-behavior.json
      - name: Run iPhone simulator recorder
        if: matrix.platform == 'ios'
        run: |
          app=$(find out/poc04-ios -name canvas_poc04_ios_ime_recorder.app -type d | head -1)
          xcrun simctl list devices available -j > out/poc04-ios/simulators.json
          device=$(python3 -c 'import json; d=json.load(open("out/poc04-ios/simulators.json")); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" dev.mostorm.canvas.poc04.ime
          for i in $(seq 1 180); do
            container=$(xcrun simctl get_app_container "$device" dev.mostorm.canvas.poc04.ime data 2>/dev/null || true)
            if test -s "$container/Documents/poc04-ime-result.json"; then
              cp "$container/Documents/poc04-ime-result.json" out/poc04-ios/ios-ime-behavior.json
              break
            fi
            sleep 1
          done
          test -s out/poc04-ios/ios-ime-behavior.json
          xcrun simctl terminate "$device" dev.mostorm.canvas.poc04.ime || true
          xcrun simctl shutdown "$device" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc04-apple-${{ matrix.platform }}
          path: out/poc04-${{ matrix.platform }}/

  # POC-04 has one final status. This aggregate is the only CI job allowed to
  # certify the unified exit: canonical Runtime artifacts plus real native IME
  # evidence, including the controlled Chinese semantic flow.
  cross-platform-acceptance:
    needs: [web, windows, android, apple]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # With merge-multiple left false, download-artifact extracts each match
        # below path/<artifact-name>; the comparator paths below are deliberate.
        with: { pattern: "poc04-*", path: out/poc04-results, merge-multiple: false }
      - name: Validate canonical Runtime matrix
        run: |
          python3 pocs/rich_text/tools/behavior_conformance.py \
            out/poc04-results/poc04-web/web-behavior.json \
            out/poc04-results/poc04-windows/windows-behavior.json \
            out/poc04-results/poc04-android/android-behavior.json
      - name: Validate real native IME evidence
        run: |
          python3 tools/poc04/validate_physical_ime.py \
            docs/quality/evidence/poc04/windows-ime-20260820-r2.json \
            docs/quality/evidence/poc04/chrome-ime-20260820-r2.json
          python3 tools/poc04/validate_apple_ime.py \
            docs/quality/evidence/poc04/apple-iphone15pro-ime-20260820.json \
            docs/quality/evidence/poc04/apple-ipad-air4-ime-20260820.json
          python3 tools/poc04/validate_android_ime.py \
            docs/quality/evidence/poc04/android-ime-20260820.json
          python3 tools/poc04/validate_macos_ime.py \
            docs/quality/evidence/poc04/macos-ime-20260820.json
      - name: Write unified POC-04 acceptance decision
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          print("## POC-04 unified acceptance")
          print("Canonical Runtime: Web/Windows/Android matrix passed.")
          print("Native IME: Chrome/Windows/Android/iOS/iPadOS/macOS evidence passed.")
          print("POC-04 status: Accepted")
          PY
