name: POC-01 Shared Engine

on:
  pull_request:
    paths:
      - "skia-sdk.lock.json"
      - "pocs/shared_engine/include/**"
      - "pocs/shared_engine/src/**"
      - "pocs/shared_engine/tests/**"
      - "pocs/shared_engine/fixtures/**"
      - "pocs/shared_engine/platform/skia/**"
      - "pocs/shared_engine/platform/web/**"
      - "pocs/shared_engine/platform/windows/**"
      - "pocs/shared_engine/platform/apple/**"
      - "pocs/shared_engine/platform/android/**"
  push:
    branches: [main]
    paths:
      - "skia-sdk.lock.json"
      - "pocs/shared_engine/include/**"
      - "pocs/shared_engine/src/**"
      - "pocs/shared_engine/tests/**"
      - "pocs/shared_engine/fixtures/**"
      - "pocs/shared_engine/platform/skia/**"
      - "pocs/shared_engine/platform/web/**"
      - "pocs/shared_engine/platform/windows/**"
      - "pocs/shared_engine/platform/apple/**"
      - "pocs/shared_engine/platform/android/**"
  workflow_dispatch:

concurrency:
  group: poc01-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIA_COMMIT: b6d106297ff9ef2ff8094033695d045e87775581
  EXPECTED_DIGEST: 47826449b895ac4f4a57b4f386379775

jobs:
  host-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap core dependencies
        run: python3 tools/bootstrap_deps.py --core --font-only
      - name: Documentation and repository validation
        run: |
          python3 tools/check_docs.py
          python3 tools/skia/check_consumer_ci.py
          python3 -m unittest discover -s tools/skia/tests -v
          python3 -m unittest discover -s pocs/shared_engine/tools -p 'test_*.py' -v
          git diff --check
      - name: Configure and build
        run: cmake --preset host-debug && cmake --build --preset host-debug --parallel
      - name: Unit, determinism, lifecycle, and short smoke
        run: |
          ctest --preset host-debug --output-on-failure
          out/host-debug/pocs/shared_engine/canvas_poc01_cli --lifecycle=100 --smoke=5
      - name: Sanitizer build
        run: |
          cmake --preset host-asan
          cmake --build --preset host-asan --parallel
          ctest --preset host-asan --output-on-failure

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: pocs/shared_engine/platform/web/package-lock.json
      - name: Bootstrap locked dependencies
        run: python3 tools/bootstrap_deps.py --core --web
      - name: Fetch verified Web Skia SDK
        run: >-
          python3 tools/skia/fetch.py --target web-wasm-webgl2
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build WASM runtime
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          python3 tools/ci_time.py --label "Canvas Web configure" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --preset web-release
          python3 tools/ci_time.py --label "Canvas Web build" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --build --preset web-release --parallel
      - name: Assert single-threaded Web artifact
        run: >-
          python3 pocs/shared_engine/tools/check_web_artifact.py
          out/web-release/pocs/shared_engine/platform/web/canvas_poc01_web.js
          out/web-release/pocs/shared_engine/platform/web/canvas_poc01_web.wasm
      - name: Build and test React demo
        working-directory: pocs/shared_engine/platform/web
        run: |
          npm ci
          python3 ../../../../tools/ci_time.py --label "Canvas Web demo build" --summary-file "$GITHUB_STEP_SUMMARY" -- npm run build
          python3 ../../../../tools/ci_time.py --label "Canvas Web acceptance" --summary-file "$GITHUB_STEP_SUMMARY" -- npm run test:e2e
      - name: Visual gate
        run: >-
          python3 pocs/shared_engine/tools/visual_compare.py
          --expected pocs/shared_engine/goldens/reference.rgba
          --actual pocs/shared_engine/platform/web/test-results/web-actual.rgba
          --artifacts out/results/web-visual
          --backend ganesh-webgl2
          --skia-commit "$SKIA_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-web
          path: |
            pocs/shared_engine/platform/web/test-results
            out/results/web-visual

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Bootstrap locked dependencies and LLVM
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --core --windows-llvm
          $installer = Resolve-Path .deps/downloads/LLVM-22.1.8-win64.exe
          $installDir = Join-Path $PWD ".deps/llvm"
          Start-Process $installer -ArgumentList "/S", "/D=$installDir" -Wait
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $installDir "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Fetch verified Windows Skia SDK
        shell: pwsh
        run: python tools/skia/fetch.py --target windows-x64-d3d12 --summary-file "$env:GITHUB_STEP_SUMMARY"
      - name: Build Windows runtime and demo
        shell: pwsh
        run: |
          python tools/ci_time.py --label "Canvas Windows configure" --summary-file "$env:GITHUB_STEP_SUMMARY" -- cmake --preset windows-release -DCMAKE_C_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe"
          python tools/ci_time.py --label "Canvas Windows build" --summary-file "$env:GITHUB_STEP_SUMMARY" -- cmake --build --preset windows-release --parallel
      - name: Unit and WARP acceptance
        shell: pwsh
        run: |
          python tools/ci_time.py --label "Canvas Windows tests" --summary-file "$env:GITHUB_STEP_SUMMARY" -- ctest --preset windows-release --output-on-failure
          New-Item -ItemType Directory -Force out/results | Out-Null
          $started = Get-Date
          try {
            & out/windows-release/pocs/shared_engine/platform/windows/canvas_poc01_windows.exe --offscreen --lifecycle=100 --smoke=60 --output=out/results/windows-actual.rgba | Tee-Object -FilePath out/results/windows-result.json
            if ($LASTEXITCODE -ne 0) { throw "Windows acceptance failed with exit code $LASTEXITCODE" }
          } finally {
            $elapsed = ((Get-Date) - $started).TotalSeconds
            "- Canvas Windows acceptance: $([math]::Round($elapsed, 3)) s" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Clang-cl ASan core check
        shell: pwsh
        run: |
          cmake -S . -B out/windows-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="$PWD/.deps/llvm/bin/clang-cl.exe" -DCANVAS_POC01_ENABLE_SKIA=OFF -DCANVAS_POC01_ENABLE_SANITIZERS=ON
          cmake --build out/windows-asan --target canvas_poc01_tests --parallel
          ctest --test-dir out/windows-asan --output-on-failure
      - name: Visual gate
        run: >-
          python pocs/shared_engine/tools/visual_compare.py
          --expected pocs/shared_engine/goldens/reference.rgba
          --actual out/results/windows-actual.rgba
          --artifacts out/results/windows-visual
          --backend ganesh-d3d12-warp
          --skia-commit "$env:SKIA_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-windows
          path: out/results

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap locked dependencies
        run: python3 tools/bootstrap_deps.py --core
      - name: Fetch verified macOS Skia SDK
        run: >-
          python3 tools/skia/fetch.py --target macos-arm64-metal
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build macOS Metal runtime
        run: |
          python3 tools/ci_time.py --label "Canvas macOS configure" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --preset macos-release
          python3 tools/ci_time.py --label "Canvas macOS build" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --build --preset macos-release --parallel
          python3 tools/ci_time.py --label "Canvas macOS tests" --summary-file "$GITHUB_STEP_SUMMARY" -- ctest --preset macos-release --output-on-failure
      - name: Reproduce reviewed raster golden
        run: |
          out/macos-release/pocs/shared_engine/platform/canvas_poc01_golden --update-golden --output=out/reference.rgba
          cmp pocs/shared_engine/goldens/reference.rgba out/reference.rgba
      - name: Metal lifecycle and result
        run: |
          mkdir -p out/results
          (cd out/results && python3 ../../tools/ci_time.py --label "Canvas macOS acceptance" --summary-file "$GITHUB_STEP_SUMMARY" -- ../macos-release/pocs/shared_engine/platform/apple/canvas_poc01_macos_runner --lifecycle=100 --smoke=60 > macos-result.json)
      - name: Visual gate
        run: >-
          python3 pocs/shared_engine/tools/visual_compare.py
          --expected pocs/shared_engine/goldens/reference.rgba
          --actual out/results/apple-actual.rgba
          --artifacts out/results/macos-visual
          --backend ganesh-metal
          --skia-commit "$SKIA_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-macos
          path: out/results

  apple-mobile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bootstrap locked dependencies
        run: python3 tools/bootstrap_deps.py --core
      - name: Fetch verified Apple mobile Skia SDKs
        run: |
          python3 tools/skia/fetch.py --target ios-arm64-metal --summary-file "$GITHUB_STEP_SUMMARY"
          python3 tools/skia/fetch.py --target ios-simulator-arm64-metal --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Clean-build iOS/iPadOS device target
        run: |
          python3 tools/ci_time.py --label "Canvas iOS device configure" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --preset ios-device-release
          python3 tools/ci_time.py --label "Canvas iOS device build" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --build --preset ios-device-release --config Release --parallel
      - name: Build iOS/iPadOS simulator runner
        run: |
          python3 tools/ci_time.py --label "Canvas iOS simulator configure" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --preset ios-simulator-release
          python3 tools/ci_time.py --label "Canvas iOS simulator build" --summary-file "$GITHUB_STEP_SUMMARY" -- cmake --build --preset ios-simulator-release --config Release --parallel
      - name: Run on iPhone and iPad simulators
        run: |
          app=$(find out/ios-simulator-release -name canvas_poc01_ios_runner.app -type d | head -1)
          python3 tools/ci_time.py --label "Canvas Apple mobile acceptance" --summary-file "$GITHUB_STEP_SUMMARY" -- python3 pocs/shared_engine/tools/run_apple_simulators.py --app "$app" --output out/results
      - name: Visual gates
        run: |
          python3 pocs/shared_engine/tools/visual_compare.py --expected pocs/shared_engine/goldens/reference.rgba --actual out/results/ios-actual.rgba --artifacts out/results/ios-visual --backend ganesh-metal-ios-simulator --skia-commit "$SKIA_COMMIT"
          python3 pocs/shared_engine/tools/visual_compare.py --expected pocs/shared_engine/goldens/reference.rgba --actual out/results/ipados-actual.rgba --artifacts out/results/ipados-visual --backend ganesh-metal-ipados-simulator --skia-commit "$SKIA_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-apple-mobile
          path: out/results

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Install locked Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.5" "ndk;27.2.12479018" "emulator" "platform-tools" "system-images;android-35;default;x86_64"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Bootstrap locked dependencies
        run: python3 tools/bootstrap_deps.py --core
      - name: Fetch verified Android Skia SDKs
        run: |
          python3 tools/skia/fetch.py --target android-arm64-v8a-gles3 --summary-file "$GITHUB_STEP_SUMMARY"
          python3 tools/skia/fetch.py --target android-x86_64-gles3 --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Clean-build Android arm64 target
        working-directory: pocs/shared_engine/platform/android
        run: >-
          python3 ../../../../tools/ci_time.py --label "Canvas Android arm64 build"
          --summary-file "$GITHUB_STEP_SUMMARY" -- gradle :app:assembleDebug
          -PcanvasPocAbi=arm64-v8a --no-daemon
      - name: Build Android Native CanvasView demo
        working-directory: pocs/shared_engine/platform/android
        run: >-
          python3 ../../../../tools/ci_time.py --label "Canvas Android x86_64 build"
          --summary-file "$GITHUB_STEP_SUMMARY" -- gradle :app:assembleDebug
          -PcanvasPocAbi=x86_64 --no-daemon
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod 0666 /dev/kvm
      - name: Emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            acceptance_started=$(date +%s)
            adb install -r pocs/shared_engine/platform/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 800x600
            adb logcat -c
            adb shell am start -n dev.mostorm.canvas.poc01/dev.mostorm.canvas.CanvasPocActivity
            timeout 180 bash -c 'until adb logcat -d -s CanvasPOC01:I | grep -q CANVAS_POC01_RESULT; do sleep 1; done'
            mkdir -p out/results
            adb pull /sdcard/Android/data/dev.mostorm.canvas.poc01/files/android-actual.rgba out/results/android-actual.rgba
            adb logcat -d -s CanvasPOC01:I | sed -n 's/.*CANVAS_POC01_RESULT //p' | tail -1 > out/results/android-result.json
            acceptance_finished=$(date +%s)
            echo "- Canvas Android acceptance: $((acceptance_finished - acceptance_started)) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Visual gate
        run: >-
          python3 pocs/shared_engine/tools/visual_compare.py
          --expected pocs/shared_engine/goldens/reference.rgba
          --actual out/results/android-actual.rgba
          --artifacts out/results/android-visual
          --backend ganesh-gles3-swiftshader
          --skia-commit "$SKIA_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-android
          path: out/results

  cross-platform-acceptance:
    if: always()
    needs: [web, windows, macos, apple-mobile, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: poc01-*
          path: out/all-results
          merge-multiple: false
      - name: Compare semantic results byte-for-byte
        run: >-
          python3 pocs/shared_engine/tools/cross_platform_acceptance.py
          --results out/all-results
          --required web windows macos ios ipados android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc01-cross-platform-acceptance
          path: out/all-results/cross-platform-acceptance.json
