name: POC-04 RichText Skia SDK Producer

on:
  pull_request:
    paths:
      - "deps.lock.json"
      - "tools/skia/**"
      - "pocs/rich_text/**"
      - "!pocs/rich_text/skia-sdk.lock.json"
      - ".github/workflows/skia-sdk-poc04-producer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skia-sdk-poc04-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE: tools/skia/profiles/poc04-richtext-v1.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Require manual publication from main
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - name: Validate SDK tools and RichText profile
        run: |
          python -m unittest discover -s tools/skia/tests -v
          python -c "from pathlib import Path; import sys; sys.path.insert(0, 'tools/skia'); from sdk import load_profile; p=load_profile(Path('$PROFILE')); assert len(p['targets']) == 4"
          git diff --check

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64-d3d12, os: windows-2025, family: windows }
          - { target: web-wasm-webgl2, os: ubuntu-24.04, family: web }
          - { target: android-arm64-v8a-gles3, os: ubuntu-24.04, family: android }
          - { target: android-x86_64-gles3, os: ubuntu-24.04, family: android }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.family == 'windows'
        with: { arch: x64 }
      - name: Install pinned Windows LLVM
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --windows-llvm
          $installer = Resolve-Path .deps/downloads/LLVM-22.1.8-win64.exe
          $installDir = Join-Path $PWD ".deps/llvm"
          Start-Process $installer -ArgumentList "/S", "/D=$installDir" -Wait
          (Join-Path $installDir "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned Emscripten
        if: matrix.family == 'web'
        run: python tools/bootstrap_deps.py --web
      - name: Install pinned Android NDK
        if: matrix.family == 'android'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.5" "ndk;27.2.12479018" || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Fetch locked Skia source for producer only
        run: python tools/bootstrap_deps.py --core --skia --sync-skia --font-only
      - name: Build Web SDK
        if: matrix.family == 'web'
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          python tools/skia/identify_toolchain.py --profile "$PROFILE" --target "${{ matrix.target }}" --output out/skia-sdk/toolchain.json
          python tools/skia/build.py --profile "$PROFILE" --target "${{ matrix.target }}"
      - name: Build Windows SDK
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/skia/identify_toolchain.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --output out/skia-sdk/toolchain.json
          python tools/skia/build.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --cc "$PWD/.deps/llvm/bin/clang-cl.exe" --cxx "$PWD/.deps/llvm/bin/clang-cl.exe"
      - name: Build Android SDK
        if: matrix.family == 'android'
        run: |
          python tools/skia/identify_toolchain.py --profile "$PROFILE" --target "${{ matrix.target }}" --ndk "$ANDROID_NDK_ROOT" --output out/skia-sdk/toolchain.json
          python tools/skia/build.py --profile "$PROFILE" --target "${{ matrix.target }}" --ndk "$ANDROID_NDK_ROOT"
      - name: Package twice and verify deterministic SDK
        shell: bash
        run: |
          python tools/skia/package.py --profile "$PROFILE" --target "${{ matrix.target }}" --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-a
          python tools/skia/package.py --profile "$PROFILE" --target "${{ matrix.target }}" --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-b
          python -c "from pathlib import Path; import sys; a=Path('out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip').read_bytes(); b=Path('out/skia-sdk/package-b/skia-sdk-${{ matrix.target }}.zip').read_bytes(); sys.exit(0 if a == b else 'SDK archive is not deterministic')"
          python tools/skia/verify.py --profile "$PROFILE" "out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip" --expected-target "${{ matrix.target }}"
      - name: Source-free POC-04 smoke (Web)
        if: matrix.family == 'web'
        shell: bash
        run: |
          source .deps/emsdk/emsdk_env.sh
          python tools/skia/smoke_poc04.py --profile "$PROFILE" --target "${{ matrix.target }}" --archive "out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip"
      - name: Source-free POC-04 smoke (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: python tools/skia/smoke_poc04.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --archive "out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip" --cc "$PWD/.deps/llvm/bin/clang-cl.exe" --cxx "$PWD/.deps/llvm/bin/clang-cl.exe"
      - name: Source-free POC-04 smoke (Android)
        if: matrix.family == 'android'
        run: python tools/skia/smoke_poc04.py --profile "$PROFILE" --target "${{ matrix.target }}" --archive "out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip" --ndk "$ANDROID_NDK_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: poc04-skia-sdk-${{ matrix.target }}
          path: out/skia-sdk/package-a/skia-sdk-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          pattern: poc04-skia-sdk-*
          path: out/skia-sdk/assets
      - run: python tools/skia/aggregate.py --profile "$PROFILE" --assets out/skia-sdk/assets --output out/skia-sdk/release
      - uses: actions/upload-artifact@v4
        with:
          name: poc04-skia-sdk-release-set
          path: out/skia-sdk/release
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poc04-skia-sdk-release-set
          path: out/skia-sdk/release
      - uses: actions/attest@v4
        with:
          subject-path: |
            out/skia-sdk/release/skia-sdk-*.zip
            out/skia-sdk/release/skia-sdk-index.json
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/skia/publish_release.py --directory out/skia-sdk/release --repository "${{ github.repository }}" --target-commit "${{ github.sha }}"
