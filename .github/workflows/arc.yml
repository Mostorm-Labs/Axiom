name: Arc / POC-06

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "arc/**"
      - "pocs/fastink/**"
      - "pocs/ink_engine/include/**"
      - "pocs/ink_engine/src/**"
      - ".github/workflows/arc.yml"
  push:
    branches: [main, "codex/poc-06-arc-fastink"]
  workflow_dispatch:

concurrency:
  group: arc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-boundary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check extractable Arc dependency boundary
        run: python3 pocs/fastink/tools/check_boundary.py
      - name: Build standalone Arc and external consumer
        run: |
          cmake -S arc -B out/arc -G Ninja -DARC_BUILD_PLATFORM_TARGETS=ON -DARC_BUILD_TESTS=ON
          cmake --build out/arc --parallel
          ctest --test-dir out/arc --output-on-failure
      - name: Check Web host adapters
        working-directory: arc/platform/web
        run: |
          npm ci
          npm run check
      - name: Markdown and diff checks
        run: |
          python3 tools/check_docs.py
          git diff --check

  poc06-headless:
    runs-on: macos-15
    needs: contract-and-boundary
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap locked core dependencies
        run: python3 tools/bootstrap_deps.py --core
      - name: Build Arc and POC-06 harness
        run: |
          cmake -S . -B out/poc06 -G Ninja \
            -DCANVAS_BUILD_POC01=OFF \
            -DCANVAS_BUILD_POC02=ON \
            -DCANVAS_POC02_BUILD_TESTS=OFF \
            -DCANVAS_BUILD_ARC=ON \
            -DCANVAS_BUILD_POC06=ON \
            -DARC_BUILD_PLATFORM_TARGETS=ON
          cmake --build out/poc06 --parallel
          ctest --test-dir out/poc06 --output-on-failure
          out/poc06/pocs/fastink/canvas_poc06_headless > out/poc06-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: arc-poc06-headless
          path: out/poc06-result.json

  platform-targets:
    runs-on: macos-15
    needs: contract-and-boundary
    steps:
      - uses: actions/checkout@v4
      - name: Build every Arc platform target
        run: |
          cmake -S arc -B out/arc-platforms -G Ninja \
            -DARC_BUILD_PLATFORM_TARGETS=ON -DARC_BUILD_TESTS=ON
          cmake --build out/arc-platforms --parallel
          ctest --test-dir out/arc-platforms -R arc_platform_targets_tests --output-on-failure
