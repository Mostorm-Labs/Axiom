name: R1 Full Skia SDK Producer

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of target names to build
        required: false
        type: string
        default: '["windows-x64-d3d12","web-wasm-webgl2","macos-arm64-metal","macos-x64-metal","ios-arm64-metal","ios-simulator-arm64-metal","android-arm64-v8a-gles3","android-x86_64-gles3"]'
      publish:
        description: Aggregate and publish an immutable release set
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: skia-sdk-r1-full-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE: tools/skia/profiles/r1-full-v1.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate producer contracts
        shell: bash
        run: |
          python -m unittest discover -s tools/skia/tests -v
          python -c "from pathlib import Path; import sys; sys.path.insert(0, 'tools/skia'); from sdk import load_profile; p=load_profile(Path('$PROFILE')); assert len(p['targets']) == 8 and len(p['variants']) == 3"
          git diff --check
      - name: Expand the selected target and variant matrix
        id: matrix
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          matrix=$(python tools/skia/classify_r1_changes.py --matrix "$TARGETS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected-matrix=$matrix" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      # Release, Debug, and ASan are independent cells with independent GN
      # outputs. A platform-scoped PR therefore creates exactly 3 jobs.
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.family == 'windows'
        with: { arch: x64 }
      - name: Install pinned Windows LLVM
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --windows-llvm
          $installer = Resolve-Path .deps/downloads/LLVM-22.1.8-win64.exe
          $installDir = Join-Path $PWD .deps/llvm
          Start-Process $installer -ArgumentList /S,"/D=$installDir" -Wait
          (Join-Path $installDir bin) | Out-File $env:GITHUB_PATH -Append
      - name: Install pinned Emscripten
        if: matrix.family == 'web'
        run: python tools/bootstrap_deps.py --web
      - name: Install pinned Android NDK
        if: matrix.family == 'android'
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.5" "ndk;27.2.12479018" || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Identify toolchain
        if: matrix.family != 'windows'
        shell: bash
        run: |
          if [[ "${{ matrix.family }}" == web ]]; then source .deps/emsdk/emsdk_env.sh; fi
          if [[ "${{ matrix.family }}" == android ]]; then extra=(--ndk "$ANDROID_NDK_ROOT"); else extra=(); fi
          python tools/skia/identify_toolchain.py --profile "$PROFILE" --target "${{ matrix.target }}" "${extra[@]}" --output out/skia-sdk/toolchain.json
      - name: Identify Windows toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/skia/identify_toolchain.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --output out/skia-sdk/toolchain.json
      - name: Reuse verified artifact from an earlier run
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/skia/reuse_artifact.py
          --repository "${{ github.repository }}"
          --current-run "${{ github.run_id }}"
          --trusted-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --trusted-branch "${{ github.head_ref || github.ref_name }}"
          --trusted-branch "${{ github.event.repository.default_branch }}"
          --target "${{ matrix.target }}"
          --variant "${{ matrix.variant }}"
          --profile "$PROFILE"
          --toolchain-json out/skia-sdk/toolchain.json
          --output out/skia-sdk/package-a
      - name: Fetch locked Skia source for a cache miss
        if: steps.reuse.outputs.hit != 'true'
        run: python tools/bootstrap_deps.py --core --skia --sync-skia --font-only
      - name: Cache selected Skia output
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: .deps/skia/out/r1-full-*-${{ matrix.variant }}
          key: >-
            r1-full-${{ matrix.variant }}-${{ runner.os }}-${{ matrix.target }}-${{ matrix.toolchain }}-
            ${{ hashFiles('deps.lock.json', 'tools/skia/profiles/r1-full-v1.json',
            'tools/skia/sdk.py', 'tools/skia/build.py', 'tools/skia/identify_toolchain.py',
            'tools/skia/package.py', 'tools/skia/verify.py', 'out/skia-sdk/toolchain.json') }}
          restore-keys: |
            r1-full-${{ matrix.variant }}-${{ runner.os }}-${{ matrix.target }}-${{ matrix.toolchain }}-
            r1-full-${{ matrix.variant }}-${{ runner.os }}-${{ matrix.target }}-
      - name: Build and package selected variant
        if: matrix.family != 'windows' && steps.reuse.outputs.hit != 'true'
        shell: bash
        run: |
          if [[ "${{ matrix.family }}" == web ]]; then source .deps/emsdk/emsdk_env.sh; fi
          extra=()
          if [[ "${{ matrix.family }}" == android ]]; then extra=(--ndk "$ANDROID_NDK_ROOT"); fi
          variant="${{ matrix.variant }}"
          python tools/skia/build.py --profile "$PROFILE" --target "${{ matrix.target }}" --variant "$variant" "${extra[@]}"
          python tools/skia/package.py --profile "$PROFILE" --target "${{ matrix.target }}" --variant "$variant" --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-a
          python tools/skia/package.py --profile "$PROFILE" --target "${{ matrix.target }}" --variant "$variant" --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-b
          cmp "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip" "out/skia-sdk/package-b/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip"
          python tools/skia/verify.py --profile "$PROFILE" --expected-target "${{ matrix.target }}" --variant "$variant" "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip"
          python tools/skia/smoke_consumer.py --profile "$PROFILE" --target "${{ matrix.target }}" --variant "$variant" --archive "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip" "${extra[@]}"
      - name: Build and package selected variant on Windows
        if: matrix.family == 'windows' && steps.reuse.outputs.hit != 'true'
        shell: pwsh
        run: |
          $extra = @('--cc', "$PWD/.deps/llvm/bin/clang-cl.exe", '--cxx', "$PWD/.deps/llvm/bin/clang-cl.exe")
          $variant = "${{ matrix.variant }}"
          $buildExtra = @()
          if ($variant -eq 'asan') { $buildExtra = @('--clang-win', "$PWD/.deps/llvm") }
          python tools/skia/build.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --variant $variant @extra @buildExtra
          if ($LASTEXITCODE -ne 0) { throw "Skia build failed: $variant" }
          python tools/skia/package.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --variant $variant --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-a
          if ($LASTEXITCODE -ne 0) { throw "SDK package-a failed: $variant" }
          python tools/skia/package.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --variant $variant --toolchain-json out/skia-sdk/toolchain.json --output out/skia-sdk/package-b
          if ($LASTEXITCODE -ne 0) { throw "SDK package-b failed: $variant" }
          $asset = "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip"
          $duplicate = "out/skia-sdk/package-b/skia-sdk-r1-full-v1-${{ matrix.target }}-$variant.zip"
          if ((Get-FileHash $asset -Algorithm SHA256).Hash -ne (Get-FileHash $duplicate -Algorithm SHA256).Hash) {
            throw "SDK archive is not deterministic: $variant"
          }
          python tools/skia/verify.py --profile "$env:PROFILE" --expected-target "${{ matrix.target }}" --variant $variant $asset
          if ($LASTEXITCODE -ne 0) { throw "SDK verification failed: $variant" }
          python tools/skia/smoke_consumer.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --variant $variant --archive $asset @extra
          if ($LASTEXITCODE -ne 0) { throw "Source-free smoke failed: $variant" }
      - name: Revalidate reused artifact without Skia source
        if: steps.reuse.outputs.hit == 'true' && matrix.family != 'windows'
        shell: bash
        run: |
          python tools/bootstrap_deps.py --core --font-only
          if [[ "${{ matrix.family }}" == web ]]; then source .deps/emsdk/emsdk_env.sh; fi
          extra=()
          if [[ "${{ matrix.family }}" == android ]]; then extra=(--ndk "$ANDROID_NDK_ROOT"); fi
          python tools/skia/smoke_consumer.py \
            --profile "$PROFILE" --target "${{ matrix.target }}" \
            --variant "${{ matrix.variant }}" \
            --archive "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-${{ matrix.variant }}.zip" \
            "${extra[@]}"
      - name: Revalidate reused artifact without Skia source on Windows
        if: steps.reuse.outputs.hit == 'true' && matrix.family == 'windows'
        shell: pwsh
        run: |
          python tools/bootstrap_deps.py --core --font-only
          $extra = @('--cc', "$PWD/.deps/llvm/bin/clang-cl.exe", '--cxx', "$PWD/.deps/llvm/bin/clang-cl.exe")
          $asset = "out/skia-sdk/package-a/skia-sdk-r1-full-v1-${{ matrix.target }}-${{ matrix.variant }}.zip"
          python tools/skia/smoke_consumer.py --profile "$env:PROFILE" --target "${{ matrix.target }}" --variant "${{ matrix.variant }}" --archive $asset @extra
          if ($LASTEXITCODE -ne 0) { throw "Reused source-free smoke failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: r1-full-skia-${{ matrix.target }}-${{ matrix.variant }}
          path: out/skia-sdk/package-a/*.zip
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          pattern: r1-full-skia-*
          path: out/skia-sdk/assets
      - name: Require the complete matrix for publication
        shell: bash
        run: |
          expected='windows-x64-d3d12 web-wasm-webgl2 macos-arm64-metal macos-x64-metal ios-arm64-metal ios-simulator-arm64-metal android-arm64-v8a-gles3 android-x86_64-gles3'
          for target in $expected; do
            for variant in release debug asan; do
              test -f "out/skia-sdk/assets/r1-full-skia-${target}-${variant}/skia-sdk-r1-full-v1-${target}-${variant}.zip"
            done
          done
      - run: python tools/skia/aggregate.py --profile "$PROFILE" --assets out/skia-sdk/assets --output out/skia-sdk/release
      - uses: actions/upload-artifact@v4
        with:
          name: r1-full-skia-release-set
          path: out/skia-sdk/release
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: r1-full-skia-release-set, path: out/skia-sdk/release }
      - uses: actions/attest@v4
        with:
          subject-path: |
            out/skia-sdk/release/skia-sdk-*.zip
            out/skia-sdk/release/skia-sdk-index.json
      - name: Publish immutable prerelease
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python tools/skia/publish_release.py --directory out/skia-sdk/release --repository "${{ github.repository }}" --target-commit "${{ github.sha }}"
