name: Windows Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve runner image version
        id: runner-image
        run: |
          $imageVersion = if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            "windows-2022"
          } else {
            $env:ImageVersion
          }
          "version=$imageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: canvas-vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-${{ steps.runner-image.outputs.version }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
      - name: Prepare vcpkg binary cache
        run: New-Item -ItemType Directory -Force "${{ github.workspace }}/.vcpkg-binary-cache" | Out-Null
      - name: Restore WebView2 SDK
        run: ./scripts/Restore-WebView2.ps1
      - name: Test and build embedded web content
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Install vcpkg dependencies
        id: vcpkg-install
        run: |
          $manifestRoot = "${{ github.workspace }}"
          $installRoot = "${{ github.workspace }}/out/build/windows-x64/vcpkg_installed"
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet x64-windows-static `
            "--x-manifest-root=$manifestRoot" `
            "--x-install-root=$installRoot"
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64-release --parallel
      - name: Test
        run: ctest --preset windows-x64-release
      - name: Composition integration tests
        run: ctest --preset windows-x64-release -R "canvas_(windows_composition|webview2_surface)_test"
      - name: Whitespace check
        run: git diff --check
